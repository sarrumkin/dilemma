name: dilemma
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  swift-embeddings:
    url: https://github.com/jkrukowski/swift-embeddings
    from: 0.0.16
targets:
  dilemma:
    type: application
    platform: iOS
    sources:
      - path: dilemma/Sources
    resources:
      - path: dilemma/Resources
    dependencies:
      - package: swift-embeddings
        product: Embeddings
      - package: swift-embeddings
        product: MLTensorUtils
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.dilemma
        INFOPLIST_FILE: dilemma/Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  dilemmaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: dilemmaTests
    dependencies:
      - target: dilemma
